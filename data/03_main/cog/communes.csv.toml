nom = "Liste des communes"
description = """
Ce fichier liste les communes de plein droit (`type_commune == 'COM'` dans le COG).
"""
mimetype = "text/csv"
section = "Découpage administratif"

[colonnes.code_commune]
type = "code_commune"
description = ""
nullable = false

[colonnes.code_region]
type = "code_region"
description = ""
nullable = false

[colonnes.code_departement]
type = "code_departement"
description = ""
nullable = false

[colonnes.code_collectivite_departementale]
type = "str"
description = ""
nullable = false

[colonnes.code_arrondissement]
type = "str"
description = ""
nullable = false

[colonnes.code_canton]
type = "str"
description = ""
nullable = false

[colonnes.nom]
type = "str"
description = "Nom complet de la commune, incluant l'éventuel article initial"
nullable = false

[colonnes.forme_possessive]
type = "str"
description = "nom complet de la commune avec charnière, par exemple \"de Paris\", \"de la Celle-Saint-Cloud\" ou \"du Mans\""
nullable = false

[colonnes.population_municipale]
type = "str"
nullable = false

[colonnes.siren_commune]
type = "str"
description = "Code SIREN de la commune"
nullable = false

[colonnes.siren_epci]
type = "str"
description = "Code SIREN de l'EPCI à fiscalité propre auquel appartient la commune"
nullable = false

[colonnes.nature_epci]
type = "str"
nullable = false

[colonnes.nom_epci]
type = "str"
description = "Nom de l'EPCI à fiscalité propre auquel appartient la commune"
nullable = false
